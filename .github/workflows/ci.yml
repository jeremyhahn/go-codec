# ci-template: v1 (customized)
# Reconciled against software/templates/github-actions/ci.yml in the
# automatethethings repo (devops.md §1/§8/§9). Divergence outside the
# repo-specific blocks below is a defect.

name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

env:
  GO_VERSION: '1.26.6'
  COVERAGE_THRESHOLD: 95
  BUILD_TAGS: 'codec_json,codec_yaml,codec_toml,codec_msgpack,codec_bson,codec_cbor,codec_avro,codec_protobuf'

jobs:
  # Job 1: Unit Tests with Coverage Enforcement
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: Generate protobuf files
        run: |
          make generate
          make generate-examples

      - name: Install dependencies
        run: go mod download

      - name: Run unit tests with coverage
        run: |
          # Run tests per package (same as local CI)
          echo "mode: set" > coverage.out
          for pkg in pkg/avro pkg/bson pkg/cbor pkg/factory pkg/json pkg/msgpack pkg/pool pkg/protobuf pkg/toml pkg/yaml; do
            echo "Testing $pkg..."
            go test -tags "${{ env.BUILD_TAGS }}" -v -race -coverprofile=coverage-$(basename $pkg).out ./$pkg
            tail -n +2 coverage-$(basename $pkg).out >> coverage.out
          done

      - name: Calculate coverage
        id: coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "coverage=${COVERAGE}" >> $GITHUB_OUTPUT
          echo "Total coverage: ${COVERAGE}%"

      - name: Check coverage threshold
        run: |
          COVERAGE=${{ steps.coverage.outputs.coverage }}
          COVERAGE_INT=$(echo "${COVERAGE}" | awk '{printf "%d", $1}')
          if [ "${COVERAGE_INT}" -lt "${{ env.COVERAGE_THRESHOLD }}" ]; then
            echo "Coverage ${COVERAGE}% is below threshold ${{ env.COVERAGE_THRESHOLD }}%"
            exit 1
          else
            echo "Coverage ${COVERAGE}% meets threshold ${{ env.COVERAGE_THRESHOLD }}%"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./coverage.out
          flags: unittests
          name: go-codec-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.coverage }}';
            const threshold = '${{ env.COVERAGE_THRESHOLD }}';
            const status = parseFloat(coverage) >= parseFloat(threshold) ? '✅' : '❌';

            const comment = `## Coverage Report ${status}

            **Total Coverage**: ${coverage}%
            **Threshold**: ${threshold}%

            ${parseFloat(coverage) >= parseFloat(threshold)
              ? '✅ Coverage meets the required threshold!'
              : '❌ Coverage is below the required threshold. Please add more tests.'}

            [View detailed coverage report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Job 2: Lint
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: Generate protobuf files
        run: |
          make generate
          make generate-examples

      - name: Run gofmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet -tags "${{ env.BUILD_TAGS }}" ./...

      # Latest action major and latest linter: devops.md §9. No version pin --
      # an undocumented pin is a defect, and there is no reason to hold one here.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m --build-tags "${{ env.BUILD_TAGS }}"

  # Job 3: Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: Generate protobuf files
        run: |
          make generate
          make generate-examples

      - name: Verify module integrity
        run: go mod verify

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      # CUSTOMIZE (with justification): this arg list is the same one the
      # Makefile's GOSEC_FLAGS carries -- devops.md §8 makes `make security`
      # the contract, so they must not drift. There are deliberately no
      # -exclude rules: the tree's only unsafe usage is in protoc-generated
      # *.pb.go, which -exclude-generated already drops, so the -exclude=G103
      # that used to sit here was redundant and would have masked hand-written
      # unsafe. -stdout -verbose text mirrors the findings into the job log:
      # on Gitea the SARIF upload step is skipped, so without it a real finding
      # produces an exit code and no diagnostics.
      - name: Run gosec security scanner
        run: |
          gosec -exclude-generated \
            -severity medium \
            -confidence medium \
            -exclude-dir=testdata \
            -tags "${{ env.BUILD_TAGS }}" \
            -stdout -verbose text \
            -fmt sarif -out gosec-results.sarif ./...

      - name: Upload gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: github.server_url == 'https://github.com'
        with:
          sarif_file: gosec-results.sarif
          category: gosec

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -tags "${{ env.BUILD_TAGS }}" ./...

  # Job 3b: Trivy (dependency CVEs + leaked secrets in the tree)
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Two paths for one gate (devops.md §8). trivy-action's setup step cannot
      # authenticate to github.com from a Gitea runner and upload-sarif has no
      # GHES-compatible endpoint there, so the action path is guarded on the
      # server URL and Gitea gates with the trivy CLI below. Both run the same
      # fs scan at the same severity; only the SARIF upload is GitHub-only.
      # examples/ is skipped: it is demo code that never ships to a consumer.
      - name: Trivy scan (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: examples
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: examples
          trivyignores: .trivyignore

      - name: Install Trivy CLI (Gitea)
        if: github.server_url != 'https://github.com'
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy gate (Gitea)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --skip-dirs examples .

  # Job 3c: Trivy image scan of the CI/tooling image this repo builds
  trivy-image:
    name: Trivy Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t go-codec:ci .

      - name: Install Trivy CLI
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      # Scoping is documented against the trivy-image target in the Makefile;
      # keep the two invocations identical. --ignore-unfixed because the Debian
      # package set is upstream's and an unfixed advisory cannot be actioned by
      # rebuilding; --skip-dirs because go/bin, go/pkg/mod and usr/local/go hold
      # upstream release builds of the linters (and gosec's own credential-rule
      # fixture, which trips the secret scanner), baked in only so the container
      # can run the checks. The Go module tree is gated unconditionally by the
      # trivy fs job above.
      - name: Trivy image gate (fail on fixable CRITICAL/HIGH)
        run: |
          trivy image --scanners vuln,secret --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            --skip-dirs go/bin --skip-dirs go/pkg/mod --skip-dirs usr/local/go go-codec:ci

  # Job 4: Build
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: Generate protobuf files
        run: |
          make generate
          make generate-examples

      - name: Build all packages
        run: go build -tags "${{ env.BUILD_TAGS }}" ./...

      - name: Build examples
        run: |
          go build -tags "${{ env.BUILD_TAGS }}" -o /tmp/codec-example ./examples/main.go
          go build -tags "${{ env.BUILD_TAGS }}" -o /tmp/codec-protobuf-example ./examples/protobuf/...

  # Job 5: Race Detector
  race:
    name: Race Detector
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: Generate protobuf files
        run: |
          make generate
          make generate-examples

      - name: Run tests with race detector
        run: go test -tags "${{ env.BUILD_TAGS }}" -race -short ./...

  # Job 6: Benchmarks
  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: Generate protobuf files
        run: |
          make generate
          make generate-examples

      - name: Run benchmarks
        run: |
          for pkg in json yaml toml msgpack bson cbor avro protobuf; do
            echo "=== ${pkg^^} Benchmarks ==="
            go test -tags "${{ env.BUILD_TAGS }}" -bench=. -benchmem -run=^$ ./pkg/$pkg || true
            echo ""
          done

  # The single required check (devops.md §1). Every job above appears in BOTH
  # the needs list and the results check -- a gate that can pass vacuously is
  # worse than no gate. join(needs.*.result) is deliberately not used: it
  # evaluates empty on Gitea and reports success while jobs fail.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [test, lint, security, trivy, trivy-image, build, race, benchmark]

    steps:
      - name: Fail closed on any non-success
        run: |
          check() { case "$2" in success) echo "OK   $1";; *) echo "FAIL $1 ($2)"; BAD=1;; esac; }
          BAD=0
          check test        "${{ needs.test.result }}"
          check lint        "${{ needs.lint.result }}"
          check security    "${{ needs.security.result }}"
          check trivy       "${{ needs.trivy.result }}"
          check trivy-image "${{ needs.trivy-image.result }}"
          check build       "${{ needs.build.result }}"
          check race        "${{ needs.race.result }}"
          check benchmark   "${{ needs.benchmark.result }}"
          exit $BAD
