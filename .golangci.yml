# golangci-lint v2 configuration; staticcheck, errcheck, unused, ineffassign, misspell and gocritic are required.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gocritic
    - gosec
    - bodyclose
    - whitespace

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false

    gocritic:
      # Default check set only. The style/opinionated/experimental tags are
      # taste, not defects, and turning them on here buys noise rather than
      # signal.
      disabled-checks:
        - ifElseChain

    gosec:
      excludes:
        # Audited zero-copy []byte/string conversions in pkg/msgpack and pkg/protobuf; gosec in the Makefile and ci.yml excludes the same.
        - G103

    misspell:
      locale: US

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # Test files and generated protobuf fixtures.
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
          - gosec
          - staticcheck
      - path: testdata/
        linters:
          - errcheck
          - gocritic
          - gosec
          - staticcheck
          - unused
      # examples/ is demo code: it prints, ignores errors for brevity, and
      # never ships to a consumer.
      - path: examples/
        linters:
          - errcheck
          - gocritic
          - gosec

# goimports is not enabled: its local-prefix grouping would rewrite the codec self-import in every package; gofmt is the format gate.
formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
